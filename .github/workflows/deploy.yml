name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - claude/daily-payroll-system-ZEsNj
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build for Cloudflare Pages
        run: npm_config_legacy_peer_deps=true npx @cloudflare/next-on-pages

      - name: Create Pages project (idempotent)
        run: npx wrangler pages project create foodmarket-payroll --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 4c66457e2156320d009a06c9fba2f4d8

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy .vercel/output/static --project-name=foodmarket-payroll --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 4c66457e2156320d009a06c9fba2f4d8
