name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - claude/daily-payroll-system-ZEsNj
      - main

env:
  CLOUDFLARE_ACCOUNT_ID: 4c66457e2156320d009a06c9fba2f4d8
  CF_PROJECT: foodmarket-payroll
  D1_DB_ID: f8f2e7df-40b0-4577-8e88-c565f08aafb0

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ตรวจโทเคนก่อนลงมือ ถ้าใช้ไม่ได้จะได้รู้ทันทีตั้งแต่ 10 วินาทีแรก
      # ไม่ใช่ build เสร็จแล้วค่อยล้มตอนจะ deploy แล้วเงียบไปหลายวัน
      - name: Check Cloudflare API token
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # ช่องว่าง/ขึ้นบรรทัดที่ติดมาตอนวางเป็นสาเหตุที่เจอบ่อย ตัดออกก่อน
          trimmed=$(printf '%s' "$CF_TOKEN" | tr -d '[:space:]')
          echo "ความยาวค่าที่อ่านได้ ${#CF_TOKEN} ตัว (ตัดช่องว่างแล้ว ${#trimmed} ตัว)"

          verify() {
            curl -s -o "$2" -w '%{http_code}' "$1" -H "Authorization: Bearer $trimmed"
          }
          # Cloudflare มีโทเคนสองแบบ ตรวจคนละ endpoint
          #   account-owned (Manage account > Account API tokens) -> /accounts/<id>/tokens/verify
          #   user          (My Profile > API Tokens)             -> /user/tokens/verify
          acct=$(verify "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify" /tmp/verify-acct.json)
          user=$(verify "https://api.cloudflare.com/client/v4/user/tokens/verify" /tmp/verify-user.json)

          if [ "$acct" != "200" ] && [ "$user" != "200" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN ใช้ไม่ได้ — ตรวจแบบ account ได้ HTTP $acct, แบบ user ได้ HTTP $user ให้สร้างโทเคนใหม่ที่มีสิทธิ์ Cloudflare Pages:Edit และ D1:Edit แล้วอัปเดต GitHub secret"
            cat /tmp/verify-acct.json; echo
            cat /tmp/verify-user.json
            exit 1
          fi
          [ "$acct" = "200" ] && echo "โทเคนใช้งานได้ (account-owned)" || echo "โทเคนใช้งานได้ (user token)"

          # ส่งต่อให้ขั้นตอนถัดไปใช้ ไม่ต้องอ่าน secret ดิบซ้ำอีก
          echo "CLOUDFLARE_API_TOKEN=$trimmed" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Download face-api.js model weights locally
        run: |
          mkdir -p public/models
          BASE="https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights"
          for f in \
            "tiny_face_detector_model-weights_manifest.json" \
            "tiny_face_detector_model-shard1" \
            "face_landmark_68_tiny_model-weights_manifest.json" \
            "face_landmark_68_tiny_model-shard1" \
            "face_recognition_model-weights_manifest.json" \
            "face_recognition_model-shard1" \
            "face_recognition_model-shard2"; do
            curl -fsSL "$BASE/$f" -o "public/models/$f"
            echo "Downloaded $f"
          done

      - name: Build for Cloudflare Pages
        run: npm_config_legacy_peer_deps=true npx @cloudflare/next-on-pages

      - name: Create Pages project (idempotent)
        run: npx wrangler pages project create $CF_PROJECT --production-branch=main || true

      - name: Bind D1 database to Pages project
        run: |
          curl -fsS -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CF_PROJECT}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"deployment_configs\":{\"production\":{\"d1_databases\":{\"DB\":{\"id\":\"${D1_DB_ID}\"}},\"ai_bindings\":{\"AI\":{}},\"compatibility_flags\":[\"nodejs_compat\"],\"compatibility_date\":\"2024-09-23\"},\"preview\":{\"d1_databases\":{\"DB\":{\"id\":\"${D1_DB_ID}\"}},\"ai_bindings\":{\"AI\":{}},\"compatibility_flags\":[\"nodejs_compat\"],\"compatibility_date\":\"2024-09-23\"}}}" | tee /tmp/bind.json
          jq -e '.success == true' /tmp/bind.json

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy .vercel/output/static --project-name=$CF_PROJECT --branch=main --commit-message="Deploy $(date +%Y%m%d%H%M%S)"
