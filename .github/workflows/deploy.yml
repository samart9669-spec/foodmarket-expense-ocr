name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - claude/daily-payroll-system-ZEsNj
      - main

env:
  CLOUDFLARE_ACCOUNT_ID: 4c66457e2156320d009a06c9fba2f4d8
  CF_PROJECT: foodmarket-payroll
  D1_DB_ID: f8f2e7df-40b0-4577-8e88-c565f08aafb0

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ตรวจโทเคนก่อนลงมือ ถ้าหมดอายุจะได้รู้ทันทีตั้งแต่ 10 วินาทีแรก
      # ไม่ใช่ build เสร็จแล้วค่อยล้มตอนจะ deploy แล้วเงียบไปหลายวัน
      - name: Check Cloudflare API token
        run: |
          code=$(curl -s -o /tmp/verify.json -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}")
          if [ "$code" != "200" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN ใช้ไม่ได้ (HTTP $code) — โทเคนหมดอายุ ถูกเพิกถอน หรือสิทธิ์ไม่พอ ให้สร้างโทเคนใหม่ใน Cloudflare (ต้องมีสิทธิ์ Cloudflare Pages:Edit และ D1:Edit) แล้วอัปเดต GitHub secret ชื่อ CLOUDFLARE_API_TOKEN"
            cat /tmp/verify.json
            exit 1
          fi
          echo "โทเคนใช้งานได้"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Download face-api.js model weights locally
        run: |
          mkdir -p public/models
          BASE="https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights"
          for f in \
            "tiny_face_detector_model-weights_manifest.json" \
            "tiny_face_detector_model-shard1" \
            "face_landmark_68_tiny_model-weights_manifest.json" \
            "face_landmark_68_tiny_model-shard1" \
            "face_recognition_model-weights_manifest.json" \
            "face_recognition_model-shard1" \
            "face_recognition_model-shard2"; do
            curl -fsSL "$BASE/$f" -o "public/models/$f"
            echo "Downloaded $f"
          done

      - name: Build for Cloudflare Pages
        run: npm_config_legacy_peer_deps=true npx @cloudflare/next-on-pages

      - name: Create Pages project (idempotent)
        run: npx wrangler pages project create $CF_PROJECT --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Bind D1 database to Pages project
        run: |
          curl -fsS -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CF_PROJECT}" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data "{\"deployment_configs\":{\"production\":{\"d1_databases\":{\"DB\":{\"id\":\"${D1_DB_ID}\"}},\"ai_bindings\":{\"AI\":{}},\"compatibility_flags\":[\"nodejs_compat\"],\"compatibility_date\":\"2024-09-23\"},\"preview\":{\"d1_databases\":{\"DB\":{\"id\":\"${D1_DB_ID}\"}},\"ai_bindings\":{\"AI\":{}},\"compatibility_flags\":[\"nodejs_compat\"],\"compatibility_date\":\"2024-09-23\"}}}" | tee /tmp/bind.json
          jq -e '.success == true' /tmp/bind.json

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy .vercel/output/static --project-name=$CF_PROJECT --branch=main --commit-message="Deploy $(date +%Y%m%d%H%M%S)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
